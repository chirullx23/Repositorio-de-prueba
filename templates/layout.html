<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sonricks Store — Golpea con estilo{% endblock %}</title>
  <meta name="description" content="Sonricks Store: balones de fútbol soccer de alto rendimiento. Golpea con estilo, juega con precisión.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Hoja de estilos externa -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>

  {% include "components/navbar.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  <!-- Script externo -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
